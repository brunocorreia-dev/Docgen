name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Create checksum
        run: cd target && sha256sum docgen.jar > docgen.jar.sha256
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign artifacts (keyless, GitHub OIDC)
        run: |
          cosign sign-blob --yes --bundle target/docgen.jar.sigstore.json target/docgen.jar
          cosign sign-blob --yes --bundle target/docgen.jar.sha256.sigstore.json target/docgen.jar.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          target/docgen.jar
          target/docgen.jar.sha256
          target/docgen.jar.sigstore.json
          target/docgen.jar.sha256.sigstore.json
          --clobber
